<!DOCTYPE html>  <html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>KINESIS | AI Text-to-Video Engine</title>  
    <style>  
        :root {  
            --primary: #00f2ff;  
            --secondary: #7000ff;  
            --bg: #0a0a12;  
            --panel: #13131f;  
            --text: #ffffff;  
            --font-main: 'Inter', sans-serif;  
        }  * { box-sizing: border-box; margin: 0; padding: 0; }  
      
    body {  
        background-color: var(--bg);  
        background-image:   
            radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.1) 0%, transparent 20%),  
            radial-gradient(circle at 90% 80%, rgba(0, 242, 255, 0.1) 0%, transparent 20%);  
        color: var(--text);  
        font-family: var(--font-main);  
        overflow-x: hidden;  
    }  

    /* Layout */  
    .app-container {  
        display: grid;  
        grid-template-columns: 350px 1fr;  
        height: 100vh;  
    }  

    /* Sidebar / Controls */  
    .controls {  
        background: var(--panel);  
        border-right: 1px solid rgba(255,255,255,0.1);  
        padding: 20px;  
        overflow-y: auto;  
        z-index: 10;  
        box-shadow: 5px 0 20px rgba(0,0,0,0.5);  
    }  

    .logo {  
        font-size: 24px;  
        font-weight: 800;  
        letter-spacing: 2px;  
        margin-bottom: 30px;  
        background: linear-gradient(90deg, var(--primary), var(--secondary));  
        -webkit-background-clip: text;  
        -webkit-text-fill-color: transparent;  
    }  

    .control-group { margin-bottom: 25px; }  
    .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }  
      
    input[type="text"], textarea, select, input[type="range"] {  
        width: 100%;  
        background: #000;  
        border: 1px solid #333;  
        color: #fff;  
        padding: 10px;  
        border-radius: 6px;  
        font-family: var(--font-main);  
        outline: none;  
        transition: 0.3s;  
    }  

    textarea { min-height: 100px; resize: vertical; }  
      
    input:focus, textarea:focus, select:focus {  
        border-color: var(--primary);  
        box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);  
    }  

    select {  
        cursor: pointer;  
        appearance: none;  
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300f2ff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");  
        background-repeat: no-repeat;  
        background-position: right 10px center;  
    }  

    /* Buttons */  
    .btn {  
        width: 100%;  
        padding: 12px;  
        border: none;  
        border-radius: 6px;  
        cursor: pointer;  
        font-weight: bold;  
        text-transform: uppercase;  
        letter-spacing: 1px;  
        transition: 0.3s;  
        margin-bottom: 10px;  
    }  

    .btn-primary {  
        background: linear-gradient(90deg, var(--secondary), var(--primary));  
        color: #fff;  
    }  

    .btn-primary:hover {  
        box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);  
        transform: scale(1.02);  
    }  

    .btn-secondary {  
        background: rgba(255,255,255,0.1);  
        color: #fff;  
        border: 1px solid rgba(255,255,255,0.2);  
    }  

    /* Preview Area */  
    .preview-area {  
        position: relative;  
        display: flex;  
        justify-content: center;  
        align-items: center;  
        background: #000;  
        overflow: hidden;  
    }  

    canvas {  
        max-width: 100%;  
        max-height: 100%;  
        box-shadow: 0 0 50px rgba(0,0,0,0.8);  
    }  

    .generating-overlay {  
        position: absolute;  
        top: 0; left: 0; width: 100%; height: 100%;  
        background: rgba(0,0,0,0.8);  
        display: flex;  
        flex-direction: column;  
        justify-content: center;  
        align-items: center;  
        z-index: 100;  
        display: none;  
    }  

    .progress-bar {  
        width: 50%;  
        height: 4px;  
        background: #333;  
        margin-top: 20px;  
        border-radius: 2px;  
        overflow: hidden;  
    }  

    .progress-fill {  
        height: 100%;  
        background: var(--primary);  
        width: 0%;  
        animation: load 2s infinite linear;  
    }  

    @keyframes load { 0% {width:0%} 50% {width:100%} 100% {width:0%} }  

    .status-text { font-size: 18px; color: var(--primary); margin-top: 10px; }  

    /* Mobile Responsive */  
    @media (max-width: 768px) {  
        .app-container { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }  
        .controls { height: auto; border-right: none; border-top: 1px solid #333; }  
    }  
</style>

</head>  
<body>  <div class="app-container">  
    <!-- Sidebar -->  
    <div class="controls">  
        <div class="logo">KINESIS AI</div>  
          
        <div class="control-group">  
            <label class="label">Input Text</label>  
            <textarea id="inputText" placeholder="Enter your script here. E.g., 'A futuristic warrior stands in the rain, looking at the city skyline.'">A futuristic warrior stands in the neon rain, looking at the city skyline.</textarea>  
        </div>  

        <div class="control-group">  
            <label class="label">Category</label>  
            <select id="category">  
                <option value="cinematic">Cinematic</option>  
                <option value="scifi">Sci-Fi</option>  
                <option value="anime">Anime</option>  
                <option value="horror">Horror</option>  
                <option value="cartoon">Cartoon</option>  
                <option value="corporate">Corporate/Ed</option>  
                <option value="music">Music Video</option>  
            </select>  
        </div>  

        <div class="control-group">  
            <label class="label">Duration (Sec)</label>  
            <input type="range" id="duration" min="3" max="60" value="10">  
            <div style="text-align: right; font-size: 12px;" id="durVal">10s</div>  
        </div>  

        <div class="control-group">  
            <label class="label">Quality</label>  
            <select id="quality">  
                <option value="480">480p</option>  
                <option value="720">720p HD</option>  
                <option value="1080">1080p FHD</option>  
            </select>  
        </div>  

        <div class="control-group">  
            <label class="label">Audio Style</label>
<select id="audioStyle">
    <option value="cinematic">Cinematic Voice</option>
    <option value="deep">Deep Voice</option>
    <option value="robotic">Robotic</option>
    <option value="emotional">Emotional</option>
    <option value="anime">Anime Style</option>
</select>
</div>

<button class="btn btn-primary" onclick="generateVideo()">
    Generate AI Video
</button>

<button class="btn btn-secondary" onclick="downloadVideo()">
    Download
</button>

</div>

<!-- Preview Area -->
<div class="preview-area">
    <canvas id="previewCanvas" width="1280" height="720"></canvas>

    <div class="generating-overlay" id="overlay">
        <div class="status-text">Generating AI Video...</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>
</div>

</div>

<script>
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');

function drawScene(text, category) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, "#7000ff");
    gradient.addColorStop(1, "#00f2ff");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px Arial";
    ctx.textAlign = "center";

    wrapText(text, canvas.width / 2, canvas.height / 2, 900, 60);

    ctx.font = "24px Arial";
    ctx.fillText(category.toUpperCase(), canvas.width / 2, 100);
}

function wrapText(text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    let lines = [];

    for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        const testWidth = metrics.width;

        if (testWidth > maxWidth && n > 0) {
            lines.push(line);
            line = words[n] + ' ';
        } else {
            line = testLine;
        }
    }

    lines.push(line);

    for (let i = 0; i < lines.length;function generateVideo() {
    const canvas = document.getElementById("previewCanvas");
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#00f2ff";
    ctx.font = "40px Arial";
    ctx.fillText("Generating AI Video...", 50, 200);

    let x = 50;

    const anim = setInterval(() => {
        ctx.clearRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle = "#000";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle = "#00f2ff";
        ctx.fillRect(x,250,150,150);

        x += 10;

        if(x > canvas.width){
            clearInterval(anim);
        }
    }, 100);
}
